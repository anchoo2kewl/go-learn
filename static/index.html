<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learn">
<title>Learn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Familjen+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<div id="app" class="wrap"><p class="muted">Loading…</p></div>

<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <div class="bar-now"><b id="bar-title">—</b><span id="bar-sub" class="muted"></span></div>
    <div class="row">
      <button id="rew" aria-label="Back 15 seconds" title="Back 15 seconds (←)">−15</button>
      <button id="play" class="play" aria-label="Play" title="Play / pause (Space) · ? for all shortcuts">Play</button>
      <button id="fwd" aria-label="Forward 15 seconds" title="Forward 15 seconds (→)">+15</button>
      <button id="next" aria-label="Next segment" title="Next segment (N)">Next</button>
      <button id="speed" aria-label="Playback speed" title="Speed ([ and ])">1×</button>
      <button id="ask" aria-label="Ask or steer" title="Ask or steer (A)">Ask</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in this segment">
  </div>
</div>
<button class="back" id="back" hidden>Back to the voice</button>
<audio id="audio" preload="auto"></audio>
<script src="static/app.js"></script>
</body>
</html>
